# One string per paragraph; HTML allowed.
bio:
  - >
    I am a second-year Ph.D. student in the
    <a href="https://ysph.yale.edu/research/department-research/biostatistics/">Department of Biostatistics</a>
    at the Yale School of Public Health, advised by
    <a href="https://www.yizezhao.com/">Prof. Yize Zhao</a>.
    My research focuses on statistical machine learning for multimodal
    neuroimaging and brain connectomics, with applications to Alzheimer's
    disease. I develop deep generative models that separate shared and
    modality-specific variation in structural and functional brain networks
    and can reconstruct one modality from the other. I also work on modeling
    disease progression from incomplete, largely cross-sectional biomarker
    data, and on multimodal normative models of healthy brain aging for
    identifying disease-related deviations.
  - >
    Before Yale, I received an M.S. in Statistics and Operations Research from
    the <a href="https://stor.unc.edu/">University of North Carolina at Chapel Hill</a>,
    where I worked with <a href="https://zhengwu.github.io/">Prof. Zhengwu Zhang</a>,
    and a B.S. in Applied Mathematics from the
    <a href="https://www.liverpool.ac.uk/">University of Liverpool</a>.

interests:
  - "Deep generative models"
  - "Normative modeling"
  - "Disease progression modeling"
  - "Multimodal neuroimaging"
