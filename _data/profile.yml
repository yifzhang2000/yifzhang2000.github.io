name_en: "Yifei Zhang"
name_zh: "张 逸 飞"
tagline: >
  Biostatistician working at the intersection of high-dimensional inference,
  brain connectomics, and machine learning. My current focus is the application
  of diffusion models to brain connectomics data, and the relationship between
  Alzheimer's disease traits and the brain's structural connectome — combining
  Bayesian data analysis, network analysis, and computational neuroscience to
  study the brain at scale.

