about: >
  My name is Yifei Zhang. I am a first year Ph.D. student at the
  <a href="https://ysph.yale.edu/">Yale School of Public Health</a>
  Biostatistics Department, supervised by
  <a href="https://www.yizezhao.com/">Prof. Yize Zhao</a>.
  Before joining Yale, I earned a Master of Science in Statistics and
  Operations Research from the
  <a href="https://stor.unc.edu/">University of North Carolina at Chapel Hill (UNC) STOR Department</a>,
  supervised by <a href="https://zhengwu.github.io/">Prof. Zhengwu Zhang</a>.
  Prior to that, I obtained a Bachelor of Science degree in Applied Mathematics
  from the <a href="https://www.liverpool.ac.uk/">University of Liverpool</a>.

research_statement: >
  My research interests include high-dimensional data analysis, computational
  neuroscience, Bayesian data analysis, network analysis, brain connectomics,
  and machine learning. I am particularly interested in the application of
  brain connectomics data in deep learning, specifically with diffusion models.
  I am also drawn to the relationship between Alzheimer's disease traits and
  brain connectomics data.

